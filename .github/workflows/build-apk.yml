name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - custom

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Enable Gradle parallel build and caching
        run: |
          mkdir -p ~/.gradle
          printf 'org.gradle.parallel=true\norg.gradle.caching=true\norg.gradle.daemon=false\n' >> ~/.gradle/gradle.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: pubspec.yaml
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # Uses the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
      # ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets when set;
      # otherwise signs with a throwaway key so the APK is still installable.
      - name: Configure signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/keys/ci.jks
            echo "::notice title=Signing::Using the keystore from the repository secrets"
          else
            echo "::warning title=Signing::ANDROID_KEYSTORE_BASE64 is not set, signing with a throwaway key"
            STORE_PASSWORD=android
            KEY_PASSWORD=android
            KEY_ALIAS=ci
            keytool -genkeypair -keystore android/keys/ci.jks \
              -storepass "$STORE_PASSWORD" -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Monekin CI"
          fi
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../keys/ci.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/keys/key.properties

      - name: Build APK
        run: flutter build apk --release

      # Prints the signing certificate so builds can be compared with a local
      # release build. The same keystore always gives the same SHA-256.
      - name: Verify APK signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | tee cert.txt
          SHA=$(grep "certificate SHA-256" cert.txt | head -1 | awk '{print $NF}')
          echo "::notice title=APK signing certificate SHA-256::$SHA"
          echo "APK signing certificate SHA-256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: monekin-apk
          path: build/app/outputs/flutter-apk/app-release.apk
